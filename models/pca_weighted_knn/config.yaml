# Configuration for Stage 3: PCA + Distance-Weighted kNN (pca_weighted_knn)
# Controlled refinement of Stage 2 (models/pca_knn):
# - Identical raw data contract, split manifest, and missing-signal encoding (100 -> -110.0)
# - Identical PCA candidates, scaling candidates, k candidates, CV folds, and selection policy
# - Only estimator.weights changes from "uniform" to "distance"
# - At k=1, distance weighting offers no meaningful multi-neighbor voting advantage over uniform 1NN.

model_id: "pca_weighted_knn"
model_family: "PCA + distance-weighted kNN"

estimator:
  class_name: "sklearn.neighbors.KNeighborsClassifier"
  weights: "distance"
  metric: "euclidean"

preprocessing:
  predictor_columns: "WAP001..WAP520"
  num_wap_features: 520
  sentinel_value: 100
  replacement_value: -110.0
  replacement_is_assumption: true
  preserve_genuine_zero_dbm: true
  pca_whiten: false
  pca_svd_solver: "full"
  fit_scope: "training_partition_only"

# Fixed paper-inspired reference baseline (with weights="distance").
# Note: At k=1, distance weighting provides no multi-neighbor voting advantage over uniform 1NN.
fixed_baseline:
  name: "paper_inspired_baseline"
  description: >
    Fixed paper-inspired reference anchor (k=1, PCA=50, whiten=False, unscaled centered inputs)
    with weights="distance" and Euclidean distance. At k=1, distance weighting is mathematically
    equivalent to uniform 1NN and offers no multi-neighbor voting advantage; substantive weighting
    effects occur only for k > 1.
  n_neighbors: 1
  n_components: 50
  scaling: "none"
  whiten: false
  weights: "distance"
  metric: "euclidean"
  k1_no_multi_neighbor_weighting_advantage: true

# Full documented hyperparameter candidate space (identical to models/pca_knn; subject to fold feasibility)
tuned_grid:
  k_values: [1, 3, 5, 7, 9, 11, 15]
  pca_components: [5, 50, 200]
  scaling_modes: ["none", "standard"]

# Staged laptop-friendly search profiles (identical to models/pca_knn)
search_profiles:
  smoke:
    description: "Minimal smoke check: 3-fold CV with a single small feasible candidate per building."
    cv_folds: 3
    k_values: [1]
    pca_components: [5]
    scaling_modes: ["none"]

  lightweight:
    description: "Laptop-friendly lightweight exploration: 3-fold CV and a restricted candidate grid."
    cv_folds: 3
    k_values: [1, 3, 5, 9]
    pca_components: [5, 50]
    scaling_modes: ["none", "standard"]

  full:
    description: "Full development search: 5-fold CV and the complete documented candidate grid."
    cv_folds: 5
    k_values: [1, 3, 5, 7, 9, 11, 15]
    pca_components: [5, 50, 200]
    scaling_modes: ["none", "standard"]

default_profile: "full"

# Deterministic model selection and tie-breaking hierarchy (identical to models/pca_knn)
selection_policy:
  primary_metric: "mean_cv_accuracy"
  tie_breaker_metric: "mean_cv_macro_f1"
  tolerance: 1.0e-9
  further_tie_breakers_in_order:
    - "smaller n_components (prefer lower-dimensional PCA subspace)"
    - "smaller n_neighbors (prefer simpler local neighborhood k)"
    - "scaling == 'none' preferred over 'standard' (fewer learned preprocessing parameters)"
    - "earlier candidate_index in canonical generation order"

# Parallelism limits (ASUS A15 laptop policy: no nested parallelism)
parallelism:
  search_workers: 1
  estimator_n_jobs: 1
  allow_nested_parallelism: false
  rule: "If search_workers > 1, estimator_n_jobs is automatically forced to 1."

# Default module relative paths
paths:
  processed_data_dir: "models/pca_weighted_knn/processed_data"
  artifacts_dir: "models/pca_weighted_knn/artifacts"
  results_dir: "models/pca_weighted_knn/results"
