# Configuration for Stage 2: PCA + Uniform-Weight kNN (pca_knn)
# Reference paper anchor: "Indoor Positioning System Using Wifi Fingerprint" (Dan Li, Le Wang, Shiqi Wu)
# Paper-inspired reconstruction — not claimed as an exact numerical reproduction.

model_id: "pca_knn"
model_family: "PCA + uniform-weight kNN"

estimator:
  class_name: "sklearn.neighbors.KNeighborsClassifier"
  weights: "uniform"
  metric: "euclidean"

preprocessing:
  predictor_columns: "WAP001..WAP520"
  num_wap_features: 520
  sentinel_value: 100
  replacement_value: -110.0
  replacement_is_assumption: true
  preserve_genuine_zero_dbm: true
  pca_whiten: false
  pca_svd_solver: "full"
  fit_scope: "training_partition_only"

# Fixed paper-inspired baseline preserved alongside tuned search
fixed_baseline:
  name: "paper_inspired_baseline"
  description: >
    Fixed paper-inspired baseline: 1-Nearest Neighbor (k=1) with uniform weights and Euclidean
    distance on 50-component PCA projections (whiten=False) of unscaled sentinel-replaced RSSI
    inputs (PCA centers features internally on each training partition without unit-variance scaling).
  n_neighbors: 1
  n_components: 50
  scaling: "none"
  whiten: false
  weights: "uniform"
  metric: "euclidean"

# Full documented hyperparameter candidate space (subject to fold/partition feasibility)
tuned_grid:
  k_values: [1, 3, 5, 7, 9, 11, 15]
  pca_components: [5, 50, 200]
  scaling_modes: ["none", "standard"]

# Staged laptop-friendly search profiles (no exhaustive repeated 10-fold CV by default)
search_profiles:
  smoke:
    description: "Minimal smoke check: 3-fold CV with a single small feasible candidate per building."
    cv_folds: 3
    k_values: [1]
    pca_components: [5]
    scaling_modes: ["none"]

  lightweight:
    description: "Laptop-friendly lightweight exploration: 3-fold CV and a restricted candidate grid."
    cv_folds: 3
    k_values: [1, 3, 5, 9]
    pca_components: [5, 50]
    scaling_modes: ["none", "standard"]

  full:
    description: "Full development search: 5-fold CV and the complete documented candidate grid."
    cv_folds: 5
    k_values: [1, 3, 5, 7, 9, 11, 15]
    pca_components: [5, 50, 200]
    scaling_modes: ["none", "standard"]

default_profile: "full"

# Deterministic model selection and tie-breaking hierarchy
selection_policy:
  primary_metric: "mean_cv_accuracy"
  tie_breaker_metric: "mean_cv_macro_f1"
  tolerance: 1.0e-9
  further_tie_breakers_in_order:
    - "smaller n_components (prefer lower-dimensional PCA subspace)"
    - "smaller n_neighbors (prefer simpler local neighborhood k)"
    - "scaling == 'none' preferred over 'standard' (fewer learned preprocessing parameters)"
    - "earlier candidate_index in canonical generation order"

# Parallelism limits (ASUS A15 laptop policy: no nested parallelism)
parallelism:
  search_workers: 1
  estimator_n_jobs: 1
  allow_nested_parallelism: false
  rule: "If search_workers > 1, estimator_n_jobs is automatically forced to 1."

# Default module relative paths
paths:
  processed_data_dir: "models/pca_knn/processed_data"
  artifacts_dir: "models/pca_knn/artifacts"
  results_dir: "models/pca_knn/results"
